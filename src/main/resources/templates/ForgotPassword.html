<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; margin: auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px;">
    <tr>
        <td style="text-align: center; padding-bottom: 20px;">
            <h2 style="color: #333;">Password Reset Request</h2>
        </td>
    </tr>
    <tr>
        <td style="padding: 10px 20px; color: #555; font-size: 16px;">
            <p>Hello,</p>
            <p>We received a request to reset your password. Please use the verification code below:</p>
        </td>
    </tr>
    <tr>
        <td style="text-align: center; padding: 20px;">
            <div style="display: inline-block; background-color: #e0e0e0; padding: 15px 30px; border-radius: 8px; font-size: 24px; font-weight: bold; color: #333;" th:text="${code}">
            </div>
        </td>
    </tr>
    <tr>
        <td style="padding: 10px 20px; color: #555; font-size: 16px;">
            <p>If you did not request a password reset, please ignore this email.</p>
            <p>Thank you,<br><strong>PTIT</strong></p>
        </td>
    </tr>
</table>

</body>
</html>
