<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận vai trò Admin</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="max-width: 600px; margin: auto; background-color: #ffffff; border-radius: 8px;
              box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px;">
    <tr>
        <td style="text-align: center; padding-bottom: 20px;">
            <h2 style="color: #333;">Xác nhận trở thành Admin</h2>
        </td>
    </tr>
    <tr>
        <td style="padding: 10px 20px; color: #555; font-size: 16px;">
            <p>Xin chào,</p>
            <p>Bạn được đề cử để trở thành <strong>admin</strong> của công ty <strong>PTIT</strong>.</p>
            <p>Nếu bạn đồng ý nhận vai trò này, vui lòng nhấn vào liên kết bên dưới để xác nhận:</p>
        </td>
    </tr>
    <tr>
        <td style="text-align: center; padding: 20px;">
            <a th:href="${confirmationLink}"
               style="display: inline-block; background-color: #007bff; color: white;
                      padding: 12px 24px; text-decoration: none; border-radius: 6px;
                      font-size: 16px; font-weight: bold; cursor: pointer">
                Tôi đồng ý trở thành Admin
            </a>
        </td>
    </tr>
    <tr>
        <td style="padding: 10px 20px; color: #555; font-size: 16px;">
            <p>Nếu bạn không mong muốn đảm nhận vai trò này, bạn có thể bỏ qua email này.</p>
            <p>Trân trọng,<br><strong>PTIT</strong></p>
        </td>
    </tr>
</table>

</body>
</html>
