name: Quiz
services:
    postgres:
        image: postgres:17.3
        restart: always
        ports: [ "5433:5432" ]
        environment:
            POSTGRES_PASSWORD: 123
            POSTGRES_USER: postgres
            POSTGRES_DB: "Quiz"
        volumes:
            -   db_postgres:/var/lib/quiz/postgres
    redis:
        image: redis:latest
        restart: always
        ports: [ "6378:6379" ]
        volumes:
            -   db_redis:/var/lib/quiz/redis
    backend:
        image: nguyentienminh0710/quiz:0.0.1
        restart: always
        env_file:
            -   .env
        environment:
            POSTGRES_HOST: postgres
            REDIS_HOST: redis
        depends_on:
            - postgres
            - redis
        ports: [ "8080:8080" ]
volumes:
    db_postgres:
    db_redis: